# =============================================================================
# ЛОКАЛЬНЫЙ МОДУЛЬ — отдаётся из build/ (НЕ со стенда).
#
# >>> Здесь меняешь имя модуля. Пример: cache-warmup -> profile.
#     Изменение применится ко ВСЕМ портам (80/8081/8082/443) одновременно.
# =============================================================================

# Запрос без завершающего слэша (иначе уйдёт в прокси на стенд)
location = /rshb-mbfl/webmodules/cache-warmup {
    return 301 /rshb-mbfl/webmodules/cache-warmup/;
}

location /rshb-mbfl/webmodules/cache-warmup/ {
    add_header Service-Worker-Allowed "/rshb-mbfl/webmodules/" always;

    alias /usr/share/nginx/html/;
    index index.html;
    try_files $uri $uri/ /index.html;
}
