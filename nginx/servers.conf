# =============================================================================
# Единый конфиг для локальной проверки модулей.
#
# Локально отдаётся ОДИН модуль (имя задано в module-locations.conf),
# всё остальное проксируется на test04.
#
# Порты:
#   80   -> host 8080 (без сжатия)
#   8081 -> host 8081 (gzip)
#   8082 -> host 8082 (brotli)
#   443  -> host 443  (https + http2 + brotli)
# =============================================================================

server {
    listen 80;
    server_name localhost;

    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;

    root /usr/share/nginx/html;

    include /etc/nginx/module-locations.conf;

    location / {
        proxy_pass https://test04.rshb.ru$request_uri;
        proxy_set_header Host test04.rshb.ru;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
    }
}

server {
    listen 8081;
    server_name localhost;

    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;

    gzip on;
    gzip_static on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    root /usr/share/nginx/html;

    include /etc/nginx/module-locations.conf;

    location / {
        proxy_pass https://test04.rshb.ru$request_uri;
        proxy_set_header Host test04.rshb.ru;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
    }
}

server {
    listen 8082;
    server_name localhost;

    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;

    brotli on;
    brotli_comp_level 6;
    brotli_static on;
    brotli_types text/plain text/css application/javascript application/json image/svg+xml;

    root /usr/share/nginx/html;

    include /etc/nginx/module-locations.conf;

    location / {
        proxy_pass https://test04.rshb.ru$request_uri;
        proxy_set_header Host test04.rshb.ru;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name localhost;

    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;

    ssl_certificate /etc/nginx/ssl/nginx.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    brotli on;
    brotli_comp_level 6;
    brotli_static on;
    brotli_types text/plain text/css application/javascript application/json image/svg+xml;

    root /usr/share/nginx/html;

    include /etc/nginx/module-locations.conf;

    location / {
        proxy_pass https://test04.rshb.ru$request_uri;
        proxy_set_header Host test04.rshb.ru;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
    }
}
