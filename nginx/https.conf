server {
    listen 443 ssl http2;
    server_name localhost;

    ssl_certificate /etc/nginx/ssl/nginx.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    brotli on;
    brotli_comp_level 6;
    brotli_static on;
    brotli_types text/plain text/css application/javascript application/json image/svg+xml;

    location /rshb-mbfl/webmodules/shared/ {
        proxy_pass https://test04.rshb.ru$request_uri;
        proxy_set_header Host test04.rshb.ru;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
    }

    location /rshb-mbfl/webmodules/cards/ {
        alias /usr/share/nginx/html/;
        index index.html;
        try_files $uri $uri/ /rshb-mbfl/webmodules/cards/index.html;
    }
}
